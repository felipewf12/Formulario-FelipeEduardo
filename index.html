<!DOCTYPE html>
<html lang='pt-BR'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='stylesheet' href='formulario.css'>
    <title>Ficha de Inscrição</title>
</head>

<body>
    <header>
        <h1>Colégio Estadual Leonardo da Vinci</h1>
        <p>Ensino Fundamental, Médio, Normal e Profissional</p>
    </header>

    <main>
        <h2>Ficha de Inscrição</h2>

        <form action='#' method='POST'>
           <!-- O código inicia um formulário HTML que envia os dados digitados para a própria página atual 
             (action='#'). O envio é feito de forma oculta e segura através do método POST (method='POST'), 
             ideal para proteger dados sensíveis. -->

            <!-- Seção de Dados Pessoais -->
            <fieldset>
                <legend>Dados Pessoais</legend>

                <label for='nome'>Nome Completo:</label>
                <input type='text' id='nome' name='nome' required><br><br>

                <label for='rg'>RG:</label>
                <input type='text' id='rg' name='rg'><br><br>

                <label for='cpf'>CPF:</label>
                <input type='text' id='cpf' name='cpf'><br><br>

                <label for='nascimento'>Data de Nascimento:</label>
                <input type='date' id='nascimento' name='nascimento'><br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"><br><br>
            </fieldset>

            <br>

            <!-- Seção de Escolha do Curso -->
            <fieldset>
                <legend>Curso Pretendido (Turno da Manhã)</legend>

                <input type="radio" id="sistemas" name="curso" value="desenvolvimento">
                <label for="sistemas">Técnico em Desenvolvimento de Sistemas</label><br>

                <input type="radio" id="docentes" name="curso" value="docentes">
                <label for="docentes">Formação de Docentes</label><br>

                <!-- Nova linha adicionada para o curso de Enfermagem -->
                <input type="radio" id="enfermagem" name="curso" value="enfermagem">
                <label for="enfermagem">Técnico em Enfermagem</label><br>
            </fieldset>

            <br>

            <!-- Termo de Compromisso e Envio -->
            <fieldset>
                <legend>Declaração</legend>
                <input type="checkbox" id="declaracao" name="declaracao" required>
                <label for="declaracao">Declaro que as informações acima são verdadeiras.</label>
            </fieldset>

            <br>

            <button type="submit">Enviar Inscrição</button>

        </form>
    </main>

</body>

</html>
